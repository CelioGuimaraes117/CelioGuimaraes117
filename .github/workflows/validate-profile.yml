name: validate-profile

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"   # weekly external link check
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Structure, assets, SVG safety, privacy and data schema
        run: python3 -I scripts/validate_profile.py
      - name: External links
        if: github.event_name != 'pull_request'
        run: python3 -I scripts/validate_profile.py --links
